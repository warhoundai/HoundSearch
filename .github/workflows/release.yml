name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: pip install '.[dev]'
      - run: python scripts/audit-source.py && python scripts/audit-dependencies.py
      - run: python -c "import os,houndsearch; assert os.environ['GITHUB_REF_NAME']=='v'+houndsearch.__version__"
      - run: python -m build && cd dist && sha256sum * > SHA256SUMS
      - name: Publish preview artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "HoundSearch $GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/*
